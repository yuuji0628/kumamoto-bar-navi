<head>

<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"CollectionPage",

<header class="public-header">

    <a class="public-brand" href="index.html">

      <span><b>KUMAMOTO</b><strong>BAR NAVI</strong><small>BAR & JOB INFORMATION</small></span>

<main class="public-directory-page">
  <section class="public-directory-hero">
    <div class="container">
      <a class="public-back-link" href="index.html">← ホーム</a>
      <p class="public-kicker">KUMAMOTO BAR DIRECTORY</p>
      <h1>今夜のBARを探す</h1>
      <p>エリア・ジャンル・キーワードで絞り込めます。</p>

      <div id="filters" class="public-directory-search">
        <label><span>📍 エリア</span><select id="areaFilter"><option value="">熊本県内すべて</option></select></label>
        <label><span>🍸 ジャンル</span><select id="genreFilter"><option value="">すべてのジャンル</option></select></label>
        <label class="public-directory-keyword"><span>⌕ キーワード</span><input id="keyword" type="search" placeholder="店名・特徴・住所"></label>
        <button id="filterBtn" type="button">検索する</button>
      </div>

      <div class="public-filter-chips">
        <button type="button" data-quick-q="飲み放題">飲み放題</button>
        <button type="button" data-quick-q="ダーツ">ダーツ</button>
        <button type="button" data-quick-q="カラオケ">カラオケ</button>
        <button type="button" data-quick-q="シーシャ">シーシャ</button>
        <button type="button" data-quick-q="一人飲み">一人飲み</button>
      </div>
    </div>
  </section>

  <section class="public-section public-directory-results">
    <div class="container">
      <div class="public-directory-top">
        <div>
          <p class="public-kicker">BAR LIST</p>
          <h2>掲載店舗</h2>
        </div>
        <span id="resultCount" class="public-result-count">読込中</span>
      </div>

      <div id="barCards" class="public-directory-grid"></div>
      <div id="noResult" class="public-empty" hidden>
        <b>条件に合う店舗が見つかりませんでした。</b>
        <span>エリアやキーワードを変えて検索してください。</span>
      </div>
      <div id="loadError" class="public-empty" hidden>
        <b>店舗情報を読み込めませんでした。</b>
        <span>時間をおいてもう一度お試しください。</span>
      </div>
    </div>
  </section>
</main>

<nav class="public-bottom-nav" aria-label="スマホ用メニュー">
  <a href="index.html"><span>⌂</span><b>ホーム</b></a>
  <a href="bars.html" class="active"><span>⌕</span><b>BARを探す</b></a>
  <a href="jobs.html"><span>▣</span><b>求人</b></a>
  <a href="listing-form.html"><span>＋</span><b>店舗掲載</b></a>
</nav>

<script>
let allShops=[];
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function cleanName(s){
  return String(s||"")
    .replace(/^【KBN独自掲載】/,"")
    .replace(/\s*[（(]\s*@[A-Za-z0-9._]+\s*[）)]\s*$/,"")
    .replace(/\s+@[A-Za-z0-9._]+\s*$/,"")
    .trim();
}
function isEditorial(s){
  return String(s.listing_status||"")==="provisional" || /^【KBN独自掲載】/.test(String(s.name||""));
}
function featureTokens(v){
  return String(v||"").split(/[、,／/・\s]+/).map(x=>x.trim()).filter(Boolean);
}
const KBN_AREAS=["熊本市","八代市","人吉市","荒尾市","水俣市","玉名市","山鹿市","菊池市","宇土市","上天草市","宇城市","阿蘇市","天草市","合志市","美里町","玉東町","南関町","長洲町","和水町","大津町","菊陽町","南小国町","小国町","産山村","高森町","西原村","南阿蘇村","御船町","嘉島町","益城町","甲佐町","山都町","氷川町","芦北町","津奈木町","錦町","多良木町","湯前町","水上村","相良村","五木村","山江村","球磨村","あさぎり町","苓北町"];
const KBN_AREA_ALIASES={
  "熊本市中央区":"熊本市","熊本市東区":"熊本市","熊本市西区":"熊本市","熊本市南区":"熊本市","熊本市北区":"熊本市",
  "八代郡氷川町":"氷川町","葦北郡芦北町":"芦北町","葦北郡津奈木町":"津奈木町",
  "上益城郡御船町":"御船町","上益城郡嘉島町":"嘉島町","上益城郡益城町":"益城町","上益城郡甲佐町":"甲佐町","上益城郡山都町":"山都町",
  "菊池郡大津町":"大津町","菊池郡菊陽町":"菊陽町",
  "玉名郡玉東町":"玉東町","玉名郡南関町":"南関町","玉名郡長洲町":"長洲町","玉名郡和水町":"和水町",
  "阿蘇郡南小国町":"南小国町","阿蘇郡小国町":"小国町","阿蘇郡産山村":"産山村","阿蘇郡高森町":"高森町","阿蘇郡西原村":"西原村","阿蘇郡南阿蘇村":"南阿蘇村",
  "下益城郡美里町":"美里町","天草郡苓北町":"苓北町",
  "球磨郡錦町":"錦町","球磨郡多良木町":"多良木町","球磨郡湯前町":"湯前町","球磨郡水上村":"水上村","球磨郡相良村":"相良村","球磨郡五木村":"五木村","球磨郡山江村":"山江村","球磨郡球磨村":"球磨村","球磨郡あさぎり町":"あさぎり町"
};
function normalizeArea(v){
  const s=String(v||"").trim();
  if(KBN_AREA_ALIASES[s])return KBN_AREA_ALIASES[s];
  for(const a of KBN_AREAS)if(s.includes(a))return a;
  return s;
}
function fillFilters(){
  const genres=[...new Set(allShops.map(s=>s.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));
  $("areaFilter").innerHTML='<option value="">熊本県内すべて</option>'+KBN_AREAS.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
  $("genreFilter").innerHTML='<option value="">すべてのジャンル</option>'+genres.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
}
function money(s){
  const min=Number(s.budget_min||0),max=Number(s.budget_max||0);
  if(min&&max&&min!==max)return `${min.toLocaleString()}〜${max.toLocaleString()}円`;
  if(min)return `${min.toLocaleString()}円〜`;
  if(max)return `〜${max.toLocaleString()}円`;
  return "";
}
function cardMedia(s){
  const name=cleanName(s.name);
  const src=s.image_url||"default-bar.svg";
  return `<div class="public-card-photo${s.image_url?"":" is-placeholder"}">
    <img src="${esc(src)}" alt="${esc(name)}" loading="lazy" onerror="this.onerror=null;this.src='default-bar.svg'">
    ${s.is_new?'<span class="public-photo-badge">NEW</span>':""}
  </div>`;
}
function render(list){
  $("resultCount").textContent=`${list.length}店舗`;
  $("noResult").hidden=!!list.length;
  $("barCards").innerHTML=list.map(s=>{
    const name=cleanName(s.name);
    const features=featureTokens(s.features).slice(0,2);
    const budget=money(s);
    return `<a class="public-directory-card" href="shop.html?slug=${encodeURIComponent(s.slug)}">
      ${cardMedia(s)}
      <div class="public-directory-card-body">
        <div class="public-card-meta">
          ${isEditorial(s)?'<span class="public-editorial-badge">KBN独自掲載</span>':'<span class="public-official-badge"><i>✓</i>正式掲載店舗</span>'}
          ${s.is_featured?'<span class="public-recommend-badge">おすすめ</span>':""}
        </div>
        <h3>${esc(name)}</h3>
        <div class="public-card-tags">
          ${s.area?`<span>${esc(normalizeArea(s.area))}</span>`:""}
          ${s.genre?`<span>${esc(s.genre)}</span>`:""}
          ${features.map(x=>`<span>${esc(x)}</span>`).join("")}
        </div>
        <div class="public-card-facts">
          ${s.hours?`<span><small>営業時間</small><b>${esc(s.hours)}</b></span>`:""}
          ${budget?`<span><small>料金目安</small><b>${esc(budget)}</b></span>`:""}
        </div>
        <p>${esc((s.description||"").replace(/※本ページ[\s\S]*/,"").slice(0,78))}${(s.description||"").length>78?"…":""}</p>
        <strong class="public-card-link">店舗を見る <i>›</i></strong>
      </div>
    </a>`;
  }).join("");
}
function filter(){
  const area=$("areaFilter").value;
  const genre=$("genreFilter").value;
  const q=$("keyword").value.trim().toLowerCase();

  const filtered=allShops.filter(s=>{
    const text=[cleanName(s.name),s.address,s.features,s.description,s.genre,normalizeArea(s.area),s.hours].join(" ").toLowerCase();
    return (!area||normalizeArea(s.area)===area)&&(!genre||String(s.genre||"").includes(genre))&&(!q||text.includes(q));
  });
  render(filtered);
  const url=new URL(location.href);
  area?url.searchParams.set("area",area):url.searchParams.delete("area");
  genre?url.searchParams.set("genre",genre):url.searchParams.delete("genre");
  q?url.searchParams.set("q",q):url.searchParams.delete("q");
  history.replaceState(null,"",url);
}
function applyUrlFilters(){
  const p=new URLSearchParams(location.search);
  $("areaFilter").value=p.get("area")||"";
  $("genreFilter").value=p.get("genre")||"";
  $("keyword").value=p.get("q")||"";
}
async function load(){
  try{
    const r=await fetch("/api/shops",{cache:"no-store"});
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error("LOAD_FAILED");
    allShops=d.shops||[];
    fillFilters();
    applyUrlFilters();
    filter();
  }catch(e){
    $("resultCount").textContent="0店舗";
    $("loadError").hidden=false;
  }
}
$("filterBtn").addEventListener("click",filter);
["areaFilter","genreFilter"].forEach(id=>$(id).addEventListener("change",filter));
$("keyword").addEventListener("keydown",e=>{if(e.key==="Enter")filter()});
document.querySelectorAll("[data-quick-q]").forEach(b=>b.addEventListener("click",()=>{
  $("keyword").value=b.dataset.quickQ||"";
  filter();
}));
load();
</script>
</body>
</html>
