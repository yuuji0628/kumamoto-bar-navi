<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="熊本県内のBAR一覧｜KUMAMOTO BAR NAVI">
  <title>BAR一覧｜KUMAMOTO BAR NAVI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="logo.png" alt="KUMAMOTO BAR NAVI ロゴ">
      <span><b>KUMAMOTO</b><br>BAR NAVI<small>BAR & JOB INFORMATION</small></span>
    </a>
    <a class="header-cta" href="listing-form.html">店舗掲載申込み</a>
  </div>
</header>

<main class="bars-page">
<section class="bars-hero">
  <div class="container">
    <a class="back-link" href="index.html">← ホームへ戻る</a>
    <p class="eyebrow">KUMAMOTO BAR DIRECTORY</p>
    <h1>熊本県内のBAR一覧</h1>
    <p>掲載中の店舗を、エリア・ジャンル・キーワードから探せます。</p>

    <div class="directory-search">
      <select id="areaFilter"><option value="">すべてのエリア</option></select>
      <select id="genreFilter"><option value="">すべてのジャンル</option></select>
      <input id="keyword" type="search" placeholder="店名・住所・特徴">
      <button id="filterBtn" type="button">検索する</button>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="directory-top">
      <div><p class="eyebrow">BAR LIST</p><h2>掲載BAR</h2></div>
      <span id="resultCount" class="result-count">読込中</span>
    </div>
    <div class="directory-grid" id="barCards"></div>
    <p id="noResult" class="no-result" style="display:none">条件に一致するBARがありません。</p>
    <p id="loadError" class="no-result" style="display:none">店舗情報を読み込めませんでした。</p>
  </div>
</section>
</main>

<script>
let allShops=[];
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function fillFilters(){
  const areas=[...new Set(allShops.map(s=>s.area).filter(Boolean))].sort();
  const genres=[...new Set(allShops.map(s=>s.genre).filter(Boolean))].sort();
  $("areaFilter").innerHTML='<option value="">すべてのエリア</option>'+areas.map(x=>`<option>${esc(x)}</option>`).join("");
  $("genreFilter").innerHTML='<option value="">すべてのジャンル</option>'+genres.map(x=>`<option>${esc(x)}</option>`).join("");
}
function money(s){
  if(s.budget_min&&s.budget_max)return `${Number(s.budget_min).toLocaleString()}〜${Number(s.budget_max).toLocaleString()}円`;
  if(s.budget_min)return `${Number(s.budget_min).toLocaleString()}円〜`;
  return "";
}
function cardMedia(s,i){
  if(s.image_url){
    return `<div class="directory-photo has-image"><img src="${esc(s.image_url)}" alt="${esc(s.name)}" loading="lazy" onerror="this.onerror=null;this.src=\'default-bar.svg\'"></div>`;
  }
  return `<div class="directory-photo has-image default-image"><img src="default-bar.svg" alt="${esc(s.name)} 画像準備中" loading="lazy"></div>`;
}
function render(list){
  $("resultCount").textContent=`${list.length}件`;
  $("noResult").style.display=list.length?"none":"block";
  $("barCards").innerHTML=list.map((s,i)=>`
    <a class="directory-card" href="shop.html?slug=${encodeURIComponent(s.slug)}">
      ${cardMedia(s,i)}
      <div class="directory-body">
        <div class="badges">
          ${s.is_featured?`<span>おすすめ</span>`:""}
          ${s.is_new?`<span>NEW</span>`:""}
          ${s.area?`<span>${esc(s.area)}</span>`:""}
          ${s.genre?`<span>${esc(s.genre)}</span>`:""}
        </div>
        <h3>${esc(s.name)}</h3>
        <p>${esc((s.description||"").slice(0,92))}${(s.description||"").length>92?"…":""}</p>
        ${money(s)?`<small class="directory-budget">平均予算 ${money(s)}</small>`:""}
        <strong>詳細を見る →</strong>
      </div>
    </a>
  `).join("");
}
function filter(){
  const area=$("areaFilter").value;
  const genre=$("genreFilter").value;
  const q=$("keyword").value.trim().toLowerCase();
  render(allShops.filter(s=>{
    const text=[s.name,s.address,s.features,s.description,s.genre,s.area].join(" ").toLowerCase();
    return (!area||s.area===area)&&(!genre||s.genre===genre)&&(!q||text.includes(q));
  }));
}
async function load(){
  try{
    const r=await fetch("/api/shops");
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error();
    allShops=d.shops||[];
    fillFilters(); render(allShops);
  }catch{
    $("resultCount").textContent="0件";
    $("loadError").style.display="block";
  }
}
$("filterBtn").addEventListener("click",filter);
["areaFilter","genreFilter"].forEach(id=>$(id).addEventListener("change",filter));
$("keyword").addEventListener("input",filter);
load();
</script>
</body>
</html>
