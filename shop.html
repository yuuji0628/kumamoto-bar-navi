<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="熊本のBAR店舗情報｜KUMAMOTO BAR NAVI">
  <title>店舗詳細｜KUMAMOTO BAR NAVI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="logo.png" alt="KUMAMOTO BAR NAVI ロゴ">
      <span><b>KUMAMOTO</b><br>BAR NAVI<small>BAR & JOB INFORMATION</small></span>
    </a>
    <a class="header-cta" href="bars.html">BAR一覧</a>
  </div>
</header>

<main class="shop-compact-page">
  <section class="shop-compact-section">
    <div class="container shop-compact-container">
      <a class="back-link compact-back" href="bars.html">← BAR一覧へ戻る</a>
      <div id="shopDetail" class="shop-db-detail"><p>読み込み中...</p></div>
    </div>
  </section>
</main>

<script>
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const slug=new URLSearchParams(location.search).get("slug");

function normalizeInstagramUrl(value){
  let v=String(value||"").trim();
  if(!v)return "";
  if(/^https?:\/\//i.test(v))return v;
  if(/^www\./i.test(v))return "https://"+v;
  if(/^instagram\.com\//i.test(v))return "https://"+v;
  if(/^@/.test(v))v=v.slice(1);
  v=v.replace(/^\/+|\/+$/g,"");
  return "https://www.instagram.com/"+encodeURIComponent(v)+"/";
}


async function track(action){
  if(!slug)return;
  try{
    await fetch(`/api/analytics/${encodeURIComponent(slug)}`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action}),
      keepalive:true
    });
  }catch{}
}

async function load(){
  if(!slug){document.getElementById("shopDetail").innerHTML="<p>店舗が指定されていません。</p>";return;}
  try{
    const r=await fetch(`/api/shops/${encodeURIComponent(slug)}`);
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error("not found");
    const s=d.shop;
    document.title=`${s.name}｜KUMAMOTO BAR NAVI`;
    const budget=s.budget_min&&s.budget_max?`${Number(s.budget_min).toLocaleString()}〜${Number(s.budget_max).toLocaleString()}円`
      :s.budget_min?`${Number(s.budget_min).toLocaleString()}円〜`
      :s.budget_max?`〜${Number(s.budget_max).toLocaleString()}円`:"—";
    const featureTags=String(s.features||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,5);
    const mapUrl=s.address?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}`:"";
    const media=s.image_url
      ? `<img class="shop-hero-photo" src="${esc(s.image_url)}" alt="${esc(s.name)}" onerror="this.onerror=null;this.outerHTML='<div class=&quot;shop-photo-placeholder&quot;>BAR IMAGE</div>'">`
      : `<div class="shop-photo-placeholder">BAR IMAGE</div>`;

    document.getElementById("shopDetail").innerHTML=`
      <article class="shop-ref-card">
        <div class="shop-ref-head">
          <p class="shop-ref-location">${esc([s.area,s.genre].filter(Boolean).join(" / "))}</p>
          <h1>${esc(s.name)}</h1>
          <div class="shop-ref-tags">${featureTags.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
        </div>

        <div class="shop-ref-specs">
          <div><small>営業時間</small><strong>${esc(s.hours||"—")}</strong></div>
          <div><small>定休日</small><strong>${esc(s.holiday||"—")}</strong></div>
          <div><small>収容人数</small><strong>${s.seats?`${Number(s.seats)}席`:"—"}</strong></div>
          <div><small>予算</small><strong>${budget}</strong></div>
          <div><small>喫煙</small><strong>${String(s.features||"").includes("喫煙可")?"喫煙可":"—"}</strong></div>
        </div>

        <div class="shop-ref-actions">
          ${mapUrl?`<a href="${mapUrl}" target="_blank" rel="noopener" data-track="map">地図で見る</a>`:""}
          ${s.address?`<button type="button" data-copy-address="${esc(s.address)}">住所をコピー</button>`:""}
          <button type="button" data-favorite-shop>お気に入り</button>
          <button type="button" data-share-shop>共有する</button>
        </div>

        <section class="shop-ref-mainbox">
          <div class="shop-ref-gallery"><div class="shop-ref-gallery-main">${media}</div></div>
          ${s.description?`<p class="shop-ref-description">${esc(s.description)}</p>`:""}
          <dl class="shop-ref-detail-list">
            ${s.address?`<div><dt>住所</dt><dd>${esc(s.address)}</dd><span></span></div>`:""}
            ${s.phone?`<div><dt>電話番号</dt><dd><a href="tel:${esc(s.phone)}" data-track="phone">${esc(s.phone)}</a></dd><span></span></div>`:""}
            ${s.hours?`<div><dt>営業時間</dt><dd>${esc(s.hours)}</dd><span></span></div>`:""}
            ${s.holiday?`<div><dt>定休日</dt><dd>${esc(s.holiday)}</dd><span></span></div>`:""}
            ${s.instagram?`<div><dt>SNS</dt><dd><a href="${esc(normalizeInstagramUrl(s.instagram))}" target="_blank" rel="noopener noreferrer" data-track="instagram">Instagram</a></dd><span>↗</span></div>`:""}
          </dl>
        </section>

        <div class="shop-ref-foot">
          ${s.is_new?`<span class="shop-ref-new"><b>NEW</b> 実掲載店舗</span>`:""}
          <small>※情報は変更される場合があります。ご来店前にご確認ください。</small>
        </div>
      </article>
    `;

    track("view");
    document.querySelectorAll("[data-track]").forEach(el=>{
      el.addEventListener("click",()=>track(el.dataset.track));
    });

    const copyBtn=document.querySelector("[data-copy-address]");
    if(copyBtn){
      copyBtn.addEventListener("click",async()=>{
        try{await navigator.clipboard.writeText(copyBtn.dataset.copyAddress);copyBtn.textContent="コピーしました";}
        catch{copyBtn.textContent="コピーできませんでした";}
      });
    }
    const shareBtn=document.querySelector("[data-share-shop]");
    if(shareBtn){
      shareBtn.addEventListener("click",async()=>{
        try{
          if(navigator.share) await navigator.share({title:s.name,url:location.href});
          else {await navigator.clipboard.writeText(location.href);shareBtn.textContent="URLをコピーしました";}
        }catch{}
      });
    }
    const favBtn=document.querySelector("[data-favorite-shop]");
    if(favBtn){
      const key="kbn_fav_"+String(s.id||s.slug||s.name);
      const apply=()=>favBtn.textContent=localStorage.getItem(key)==="1"?"お気に入り済み":"お気に入り";
      apply();
      favBtn.addEventListener("click",()=>{
        localStorage.setItem(key,localStorage.getItem(key)==="1"?"0":"1");
        apply();
      });
    }
  }catch{
    document.getElementById("shopDetail").innerHTML='<p>この店舗は現在非公開、または削除されています。</p>';
  }
}
load();
</script>
</body>
</html>
