<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="熊本のBAR店舗情報｜KUMAMOTO BAR NAVI">
  <meta name="theme-color" content="#080b10">
  <title>店舗詳細｜KUMAMOTO BAR NAVI</title>
  <link rel="stylesheet" href="style.css?v=114">
<link id="dynamicCanonical" rel="canonical" href="https://kumamoto-bar-navi.rrwpvwmz8p.workers.dev/shop.html">
<meta id="dynamicOgTitle" property="og:title" content="店舗詳細｜KUMAMOTO BAR NAVI">
<meta id="dynamicOgDescription" property="og:description" content="熊本のBAR店舗情報">
<meta id="dynamicOgUrl" property="og:url" content="https://kumamoto-bar-navi.rrwpvwmz8p.workers.dev/shop.html">
<meta property="og:type" content="website">
<script id="shopJsonLd" type="application/ld+json">{}</script>
</head>
<body class="public-v109">

<header class="public-header">
  <div class="container public-header-inner">
    <a class="public-brand" href="index.html">
      <img src="logo.png" alt="KUMAMOTO BAR NAVI">
      <span><b>KUMAMOTO</b><strong>BAR NAVI</strong><small>BAR & JOB INFORMATION</small></span>
    </a>
    <a class="public-header-cta" href="bars.html">BARを探す</a>
  </div>
</header>

<main class="public-shop-page">
  <div class="container">
    <a class="public-back-link public-shop-back" href="bars.html">← BAR一覧へ</a>
    <div id="shopDetail"><div class="public-loading">店舗情報を読み込んでいます...</div></div>
  </div>
</main>

<nav class="public-bottom-nav" aria-label="スマホ用メニュー">
  <a href="index.html"><span>⌂</span><b>ホーム</b></a>
  <a href="bars.html" class="active"><span>⌕</span><b>BARを探す</b></a>
  <a href="jobs.html"><span>▣</span><b>求人</b></a>
  <a href="listing-form.html"><span>＋</span><b>店舗掲載</b></a>
</nav>

<script>
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const slug=new URLSearchParams(location.search).get("slug");

function cleanName(v){
  return String(v||"")
    .replace(/^【KBN独自掲載】/,"")
    .replace(/\s*[（(]\s*@[A-Za-z0-9._]+\s*[）)]\s*$/,"")
    .replace(/\s+@[A-Za-z0-9._]+\s*$/,"")
    .trim();
}
function isEditorial(s){return String(s.listing_status||"")==="provisional" || /^【KBN独自掲載】/.test(String(s.name||""))}
function normalizeArea(v){
  const s=String(v||"").trim();
  const aliases={
    "八代郡氷川町":"氷川町","葦北郡芦北町":"芦北町","葦北郡津奈木町":"津奈木町",
    "下益城郡美里町":"美里町","天草郡苓北町":"苓北町"
  };
  if(aliases[s])return aliases[s];
  if(/^熊本市.+区$/.test(s))return "熊本市";
  return s;
}
function tokens(v){return String(v||"").split(/[、,／/・\s]+/).map(x=>x.trim()).filter(Boolean)}
function normalizeInstagramUrl(value){
  let v=String(value||"").trim();
  if(!v)return "";
  if(/^https?:\/\//i.test(v))return v;
  if(/^@/.test(v))v=v.slice(1);
  v=v.replace(/^www\./i,"").replace(/^instagram\.com\//i,"").replace(/^\/+|\/+$/g,"");
  return "https://www.instagram.com/"+encodeURIComponent(v)+"/";
}
function budgetText(s){
  const min=Number(s.budget_min||0),max=Number(s.budget_max||0);
  if(min&&max&&min!==max)return `${min.toLocaleString()}〜${max.toLocaleString()}円`;
  if(min)return `${min.toLocaleString()}円〜`;
  if(max)return `〜${max.toLocaleString()}円`;
  return "情報なし";
}
async function track(action){
  if(!slug)return;
  try{
    await fetch(`/api/analytics/${encodeURIComponent(slug)}`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action}),keepalive:true
    });
  }catch{}
}

function setMeta(selector,content){
  const el=document.querySelector(selector);
  if(el && content)el.setAttribute("content",content);
}
function updateShopSeo(s,name,desc){
  const canonical=`https://kumamoto-bar-navi.rrwpvwmz8p.workers.dev/shop.html?slug=${encodeURIComponent(s.slug||slug||"")}`;
  const title=`${name}｜${normalizeArea(s.area)||"熊本"}のBAR｜KUMAMOTO BAR NAVI`;
  const description=[
    `${normalizeArea(s.area)||"熊本"}の${s.genre||"BAR"}「${name}」`,
    s.hours?`営業時間 ${s.hours}`:"",
    (s.budget_min||s.budget_max)?`料金目安 ${budgetText(s)}`:"",
    desc?desc.slice(0,80):""
  ].filter(Boolean).join("。").slice(0,155);

  document.title=title;

  const md=document.querySelector('meta[name="description"]');
  if(md)md.setAttribute("content",description);

  const canonicalEl=document.getElementById("dynamicCanonical");
  if(canonicalEl)canonicalEl.setAttribute("href",canonical);

  setMeta("#dynamicOgTitle",title);
  setMeta("#dynamicOgDescription",description);
  setMeta("#dynamicOgUrl",canonical);

  const ld=document.getElementById("shopJsonLd");
  if(ld){
    const data={
      "@context":"https://schema.org",
      "@type":"BarOrPub",
      "name":name,
      "url":canonical
    };
    if(s.address)data.address={
      "@type":"PostalAddress",
      "streetAddress":s.address,
      "addressRegion":"熊本県",
      "addressCountry":"JP"
    };
    if(s.phone)data.telephone=s.phone;
    if(s.hours)data.openingHours=s.hours;
    if(s.image_url)data.image=s.image_url;
    if(desc)data.description=desc.slice(0,500);
    ld.textContent=JSON.stringify(data);
  }
}

async function load(){
  const box=document.getElementById("shopDetail");
  if(!slug){box.innerHTML='<div class="public-empty"><b>店舗が指定されていません。</b></div>';return;}
  try{
    const r=await fetch(`/api/shops/${encodeURIComponent(slug)}`,{cache:"no-store"});
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error("NOT_FOUND");
    const s=d.shop;
    const name=cleanName(s.name);
    const editorial=isEditorial(s);
    document.title=`${name}｜KUMAMOTO BAR NAVI`;

    const gallery=[s.image_url,...(d.images||[]).map(x=>x.image_url)].filter(Boolean);
    const images=[...new Set(gallery)];
    const mainImage=images[0]||"default-bar.svg";
    const extra=images.slice(1,5);
    const features=tokens(s.features).slice(0,8);
    const mapUrl=s.address?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}`:"";
    const insta=normalizeInstagramUrl(s.instagram);
    const desc=String(s.description||"").replace(/※本ページ[\s\S]*/,"").trim();

    updateShopSeo(s,name,desc);

    box.innerHTML=`
      <article class="public-shop-layout">
        <section class="public-shop-visual">
          <div class="public-shop-main-photo${s.image_url?"":" is-placeholder"}">
            <img src="${esc(mainImage)}" alt="${esc(name)}" onerror="this.onerror=null;this.src='default-bar.svg'">
          </div>
          ${extra.length?`<div class="public-shop-thumbs">${extra.map(u=>`<img src="${esc(u)}" alt="${esc(name)}" loading="lazy">`).join("")}</div>`:""}
        </section>

        <section class="public-shop-summary">
          <div class="public-shop-badges">
            ${editorial?'<span class="public-editorial-badge">KBN独自掲載</span>':""}
            ${s.is_new?'<span class="public-new-badge">NEW</span>':""}
          </div>
          <p class="public-shop-location">${esc([normalizeArea(s.area),s.genre].filter(Boolean).join(" / "))}</p>
          <h1>${esc(name)}</h1>

          <div class="public-shop-tags">
            ${features.map(x=>`<span>${esc(x)}</span>`).join("")}
          </div>

          <div class="public-shop-keyfacts">
            <div><small>営業時間</small><b>${esc(s.hours||"情報なし")}</b></div>
            <div><small>料金目安</small><b>${esc(budgetText(s))}</b></div>
            <div><small>定休日</small><b>${esc(s.holiday||"情報なし")}</b></div>
            <div><small>席数</small><b>${s.seats?`${Number(s.seats)}席`:"情報なし"}</b></div>
          </div>

          <div class="public-shop-primary-actions">
            ${mapUrl?`<a href="${esc(mapUrl)}" target="_blank" rel="noopener" data-track="map">📍 地図で見る</a>`:""}
            ${insta?`<a href="${esc(insta)}" target="_blank" rel="noopener" data-track="instagram">Instagram ↗</a>`:""}
            ${s.phone?`<a href="tel:${esc(s.phone)}" data-track="phone">☎ 電話する</a>`:""}
          </div>
        </section>

        <section class="public-shop-content">
          ${desc?`<div class="public-shop-description"><p class="public-kicker">ABOUT</p><h2>お店について</h2><p>${esc(desc)}</p></div>`:""}

          <div class="public-shop-info">
            <div class="public-shop-info-head"><p class="public-kicker">INFORMATION</p><h2>店舗情報</h2></div>
            <dl>
              <div><dt>店名</dt><dd>${esc(name)}</dd></div>
              ${s.area?`<div><dt>エリア</dt><dd>${esc(normalizeArea(s.area))}</dd></div>`:""}
              ${s.genre?`<div><dt>ジャンル</dt><dd>${esc(s.genre)}</dd></div>`:""}
              ${s.address?`<div><dt>住所</dt><dd>${esc(s.address)}</dd></div>`:""}
              ${s.hours?`<div><dt>営業時間</dt><dd>${esc(s.hours)}</dd></div>`:""}
              ${s.holiday?`<div><dt>定休日</dt><dd>${esc(s.holiday)}</dd></div>`:""}
              ${(s.budget_min||s.budget_max)?`<div><dt>料金目安</dt><dd>${esc(budgetText(s))}</dd></div>`:""}
              ${s.seats?`<div><dt>席数</dt><dd>${Number(s.seats)}席</dd></div>`:""}
              ${s.phone?`<div><dt>電話番号</dt><dd><a href="tel:${esc(s.phone)}">${esc(s.phone)}</a></dd></div>`:""}
            </dl>
          </div>

          ${editorial?`
          <div class="public-editorial-note">
            <b>KBN独自掲載について</b>
            <p>このページは、公開されている情報をもとにKUMAMOTO BAR NAVIが独自に掲載しています。内容の修正・削除をご希望の場合はお問い合わせください。</p>
            <a href="contact.html">掲載内容について連絡する →</a>
          </div>`:""}

          <div class="public-shop-secondary-actions">
            ${s.address?`<button type="button" data-copy-address="${esc(s.address)}">住所をコピー</button>`:""}
            <button type="button" data-favorite-shop>♡ お気に入り</button>
            <button type="button" data-share-shop>共有する</button>
          </div>

          <p class="public-shop-disclaimer">※営業時間・料金・定休日などは変更される場合があります。ご来店前に店舗の公式情報をご確認ください。</p>
        </section>
      </article>
    `;

    track("view");
    document.querySelectorAll("[data-track]").forEach(el=>el.addEventListener("click",()=>track(el.dataset.track)));

    const copy=document.querySelector("[data-copy-address]");
    copy?.addEventListener("click",async()=>{
      try{await navigator.clipboard.writeText(copy.dataset.copyAddress);copy.textContent="✓ コピーしました"}catch{}
    });

    const fav=document.querySelector("[data-favorite-shop]");
    if(fav){
      const key="kbn_fav_"+String(s.id||s.slug||name);
      const paint=()=>fav.textContent=localStorage.getItem(key)==="1"?"♥ お気に入り済み":"♡ お気に入り";
      paint();
      fav.addEventListener("click",()=>{
        localStorage.setItem(key,localStorage.getItem(key)==="1"?"0":"1");paint();
      });
    }

    const share=document.querySelector("[data-share-shop]");
    share?.addEventListener("click",async()=>{
      try{
        if(navigator.share)await navigator.share({title:name,url:location.href});
        else{await navigator.clipboard.writeText(location.href);share.textContent="✓ URLコピー済み"}
      }catch{}
    });
  }catch(e){
    box.innerHTML='<div class="public-empty"><b>店舗情報が見つかりませんでした。</b><span>BAR一覧からもう一度お選びください。</span></div>';
  }
}
load();
</script>
</body>
</html>
