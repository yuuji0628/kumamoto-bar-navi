<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="熊本のBAR店舗情報｜KUMAMOTO BAR NAVI">
  <title>店舗詳細｜KUMAMOTO BAR NAVI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="logo.png" alt="KUMAMOTO BAR NAVI ロゴ">
      <span><b>KUMAMOTO</b><br>BAR NAVI<small>BAR & JOB INFORMATION</small></span>
    </a>
    <a class="header-cta" href="bars.html">BAR一覧</a>
  </div>
</header>

<main class="shop-compact-page">
  <section class="shop-compact-section">
    <div class="container shop-compact-container">
      <a class="back-link compact-back" href="bars.html">← BAR一覧へ戻る</a>
      <div id="shopDetail" class="shop-db-detail"><p>読み込み中...</p></div>
    </div>
  </section>
</main>

<script>
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const slug=new URLSearchParams(location.search).get("slug");
async function load(){
  if(!slug){document.getElementById("shopDetail").innerHTML="<p>店舗が指定されていません。</p>";return;}
  try{
    const r=await fetch(`/api/shops/${encodeURIComponent(slug)}`);
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error("not found");
    const s=d.shop;
    document.title=`${s.name}｜KUMAMOTO BAR NAVI`;
    const budget=s.budget_min&&s.budget_max?`${Number(s.budget_min).toLocaleString()}〜${Number(s.budget_max).toLocaleString()}円`:"";
    const media=s.image_url
      ? `<img class="shop-main-image" src="${esc(s.image_url)}" alt="${esc(s.name)}" onerror="this.onerror=null;this.outerHTML='<div class=&quot;shop-default-placeholder&quot;>BAR IMAGE</div>'">`
      : `<div class="shop-default-placeholder">BAR IMAGE</div>`;
    const tags=[
      s.is_featured?"おすすめ":"",
      s.is_new?"NEW":"",
      s.area||"",
      s.genre||""
    ].filter(Boolean);
    const featureTags=String(s.features||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,5);
    const mapUrl=s.address?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}`:"";
    document.getElementById("shopDetail").innerHTML=`
      <article class="shop-compact-card">
        <div class="shop-compact-media">${media}</div>

        <div class="shop-compact-head">
          <div class="badges shop-top-badges">
            ${tags.map(x=>`<span>${esc(x)}</span>`).join("")}
          </div>
          <h1>${esc(s.name)}</h1>
          <p class="shop-compact-meta">${[s.area,s.genre].filter(Boolean).map(esc).join(" / ")}</p>
          ${featureTags.length?`<div class="badges shop-feature-badges">${featureTags.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}
        </div>

        <div class="shop-compact-specs">
          ${s.hours?`<div><small>営業時間</small><strong>${esc(s.hours)}</strong></div>`:""}
          ${s.holiday?`<div><small>定休日</small><strong>${esc(s.holiday)}</strong></div>`:""}
          ${s.seats?`<div><small>席数</small><strong>${Number(s.seats)}席</strong></div>`:""}
          ${budget?`<div><small>平均予算</small><strong>${budget}</strong></div>`:""}
        </div>

        <div class="shop-compact-actions">
          ${mapUrl?`<a href="${mapUrl}" target="_blank" rel="noopener">🗺️ 地図で見る</a>`:""}
          ${s.address?`<button type="button" data-copy-address="${esc(s.address)}">住所をコピー</button>`:""}
          ${s.instagram?`<a href="${esc(s.instagram)}" target="_blank" rel="noopener">Instagram</a>`:""}
          <button type="button" data-share-shop>共有する</button>
        </div>

        ${s.description?`<div class="shop-compact-description">${esc(s.description)}</div>`:""}

        <dl class="shop-compact-detail-list">
          ${s.address?`<div><dt>住所</dt><dd>${esc(s.address)}</dd></div>`:""}
          ${s.phone?`<div><dt>電話番号</dt><dd>${esc(s.phone)}</dd></div>`:""}
          ${s.hours?`<div><dt>営業時間</dt><dd>${esc(s.hours)}</dd></div>`:""}
          ${s.holiday?`<div><dt>定休日</dt><dd>${esc(s.holiday)}</dd></div>`:""}
          ${budget?`<div><dt>平均予算</dt><dd>${budget}</dd></div>`:""}
          ${s.seats?`<div><dt>席数</dt><dd>${Number(s.seats)}席</dd></div>`:""}
        </dl>

        ${s.is_new?`<div class="shop-compact-new"><b>NEW</b><span>掲載店舗</span></div>`:""}
      </article>
    `;

    const copyBtn=document.querySelector("[data-copy-address]");
    if(copyBtn){
      copyBtn.addEventListener("click",async()=>{
        try{await navigator.clipboard.writeText(copyBtn.dataset.copyAddress);copyBtn.textContent="コピーしました";}
        catch{copyBtn.textContent="コピーできませんでした";}
      });
    }
    const shareBtn=document.querySelector("[data-share-shop]");
    if(shareBtn){
      shareBtn.addEventListener("click",async()=>{
        try{
          if(navigator.share) await navigator.share({title:s.name,url:location.href});
          else {await navigator.clipboard.writeText(location.href);shareBtn.textContent="URLをコピーしました";}
        }catch{}
      });
    }
  }catch{
    document.getElementById("shopDetail").innerHTML='<p>この店舗は現在非公開、または削除されています。</p>';
  }
}
load();
</script>
</body>
</html>
