<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店舗掲載申込み｜KUMAMOTO BAR NAVI</title><link rel="stylesheet" href="style.css"></head><body>
<main class="utility-page"><section class="utility-hero"><div class="container"><a class="back-link" href="index.html">← ホーム</a><p class="eyebrow">FREE LISTING</p><h1>店舗掲載申込み</h1><p>送信内容は運営管理画面へ直接届きます。</p></div></section>
<section class="section"><div class="container"><form id="f" class="admin-shop-form"><div class="admin-form-grid">
<label><span>店舗名 *</span><input id="shop_name" required></label><label><span>担当者名</span><input id="contact_name"></label>
<label><span>メール</span><input id="email" type="email"></label><label><span>電話番号</span><input id="phone"></label>
<label class="span-2"><span>住所</span><input id="address"></label><label><span>営業時間</span><input id="hours"></label><label><span>定休日</span><input id="holiday"></label>
<label><span>Instagram</span><input id="instagram"></label><label><span>ジャンル</span><input id="genre"></label>
<label class="span-2"><span>特徴</span><input id="features"></label><label class="span-2"><span>店舗紹介文</span><textarea id="description" rows="6"></textarea></label>
<label><span>平均予算 最低</span><input id="budget_min" type="number"></label><label><span>平均予算 最高</span><input id="budget_max" type="number"></label>
<label><span>席数</span><input id="seats" type="number"></label><label><span>求人掲載</span><select id="wants_job"><option value="0">希望しない</option><option value="1">希望する</option></select></label>
<label class="span-2"><span>備考</span><textarea id="note" rows="4"></textarea></label></div><button class="btn-gold">掲載申込みを送信</button><p id="status"></p></form></div></section></main>
<script>const $=id=>document.getElementById(id);$("f").onsubmit=async e=>{e.preventDefault();const d={};["shop_name","contact_name","email","phone","address","hours","holiday","instagram","genre","features","description","budget_min","budget_max","seats","note"].forEach(k=>d[k]=$(k).value);d.wants_job=$("wants_job").value==="1";$("status").textContent="送信中...";const r=await fetch("/api/submissions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});const j=await r.json();$("status").textContent=r.ok?"送信しました。掲載審査後に反映されます。":"送信できませんでした："+(j.error||r.status);if(r.ok)$("f").reset()}</script></body></html>
