<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAR求人｜KUMAMOTO BAR NAVI</title><link rel="stylesheet" href="style.css"></head><body><main class="utility-page"><section class="utility-hero"><div class="container"><a class="back-link" href="index.html">← ホーム</a><p class="eyebrow">BAR JOBS</p><h1>熊本のBAR求人</h1></div></section><section class="section"><div class="container"><div id="jobs" class="admin-shop-list">読み込み中...</div></div></section></main><script>const e=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));fetch("/api/jobs").then(r=>r.json()).then(d=>{jobs.innerHTML=(d.jobs||[]).map(j=>`<article class="admin-shop-item"><div><h3>${e(j.title)}</h3><p>${e(j.shop_name||'')} / ${e(j.employment_type||'')}</p><strong>${e(j.salary||'')}</strong><p>${e(j.description||'')}</p><small>${e(j.hours||'')}</small></div></article>`).join("")||"<p>現在掲載中の求人はありません。</p>"})</script></body></html>
