<main class="public-jobs-page">

  <section class="public-section public-jobs-section">

<script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function cleanShopName(v){
  let s=String(v||"")
    .replace(/^【KBN独自掲載】/,"")
    .replace(/\s*[（(]\s*@[A-Za-z0-9._]+\s*[）)]\s*$/,"")
    .replace(/\s+@[A-Za-z0-9._]+\s*$/,"")
    .trim();

  // Remove common search-result noise without changing the stored value.
  s=s.replace(/^(熊本県?\s*)?(熊本市\s*)?(の\s*)?/,"").trim();

  if(s.length>42)s=s.slice(0,42)+"…";
  return s||"店舗名";
}

function cleanJobTitle(v){
  let s=String(v||"").trim();
  if(!s)return "スタッフ募集";
  s=s.replace(/\s*[｜|]\s*.+$/,"").trim();
  if(s.length>28)s=s.slice(0,28)+"…";
  return s;
}

function sourceInfo(description){
  const text=String(description||"");
  const m=text.match(/情報元[：:]\s*(https?:\/\/[^\s]+)/i) || text.match(/(https?:\/\/[^\s]+)/i);
  if(!m)return {url:"",label:""};
  const url=m[1].replace(/[、。,.)）]+$/,"");
  let label="掲載元を見る";
  try{
    const host=new URL(url).hostname.replace(/^www\./,"");
    const names={
      "baitoru.com":"バイトル",
      "townwork.net":"タウンワーク",
      "indeed.com":"Indeed",
      "jp.indeed.com":"Indeed",
      "engage.net":"engage",
      "froma.com":"フロム・エー",
      "求人ボックス.com":"求人ボックス"
    };
    label=names[host]||host;
  }catch{}
  return {url,label};
}

function cleanDescription(v){
  let s=String(v||"")
    .replace(/情報元[：:]\s*https?:\/\/[^\s]+/gi,"")
    .replace(/https?:\/\/[^\s]+/gi,"")
    .replace(/\s+/g," ")
    .trim();

  // Avoid showing search-result boilerplate as a wall of text.
  s=s.replace(/^(一覧\s*[・·]\s*)/,"").trim();

  if(s.length>150)s=s.slice(0,150)+"…";
  return s;
}

function areaFromText(j){
  const text=[j.shop_name,j.description].join(" ");
  const m=text.match(/熊本市|八代市|人吉市|荒尾市|水俣市|玉名市|山鹿市|菊池市|宇土市|上天草市|宇城市|阿蘇市|天草市|合志市|氷川町|大津町|菊陽町|益城町|御船町|芦北町|苓北町/);
  return m?m[0]:"熊本県";
}

function normalizeSalary(v){
  const s=String(v||"").trim();
  if(!s)return "";
  return s
    .replace(/^給与\s*/,"")
    .replace(/^給料\s*/,"")
    .replace(/\s+/g," ");
}

function renderJob(j){
  const shop=cleanShopName(j.shop_name);
  const title=cleanJobTitle(j.title);
  const salary=normalizeSalary(j.salary);
  const employment=String(j.employment_type||"").trim();
  const hours=String(j.hours||"").trim();
  const desc=cleanDescription(j.description);
  const source=sourceInfo(j.description);
  const area=areaFromText(j);

  const detailHref=j.shop_slug
    ? `shop.html?slug=${encodeURIComponent(j.shop_slug)}`
    : "bars.html";

  return `<article class="public-job-card">
    <div class="public-job-card-top">
      <span class="public-job-type">${esc(title)}</span>
      ${source.url?`<span class="public-job-source-badge">掲載元あり</span>`:""}
    </div>

    <h3 class="public-job-shop">${esc(shop)}</h3>

    ${salary?`
    <div class="public-job-salary">
      <small>給与</small>
      <strong>${esc(salary)}</strong>
    </div>`:""}

    <div class="public-job-tags">
      ${area?`<span>${esc(area)}</span>`:""}
      ${employment?`<span>${esc(employment)}</span>`:""}
      ${hours?`<span>${esc(hours)}</span>`:""}
    </div>

    ${desc?`<p class="public-job-description">${esc(desc)}</p>`:""}

    <div class="public-job-actions">
      ${source.url
        ? `<a class="public-job-primary" href="${esc(source.url)}" target="_blank" rel="noopener">求人詳細を見る <i>↗</i></a>`
        : `<a class="public-job-primary" href="${detailHref}">店舗を見る <i>›</i></a>`
      }
      ${j.shop_slug?`<a class="public-job-secondary" href="${detailHref}">店舗情報</a>`:""}
    </div>

    ${source.url?`<small class="public-job-source">情報元：${esc(source.label)}</small>`:""}
  </article>`;
}

async function loadJobs(){
  try{
    const r=await fetch("/api/jobs",{cache:"no-store"});
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error("LOAD_FAILED");

    const list=d.jobs||[];
    $("jobCount").textContent=`${list.length}件`;

    if(!list.length){
      $("jobs").innerHTML="";
      $("jobsEmpty").hidden=false;
      return;
    }

    $("jobs").innerHTML=list.map(renderJob).join("");
  }catch(e){
    $("jobCount").textContent="0件";
    $("jobs").innerHTML='<div class="public-empty"><b>求人情報を読み込めませんでした。</b><span>時間をおいてもう一度お試しください。</span></div>';
  }
}
loadJobs();
</script>
