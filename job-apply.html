<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BAR LUMIÈRE 求人応募｜KUMAMOTO BAR NAVI">
  <title>求人応募｜KUMAMOTO BAR NAVI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="logo.png" alt="KUMAMOTO BAR NAVI ロゴ">
      <span><b>KUMAMOTO</b><br>BAR NAVI<small>BAR & JOB INFORMATION</small></span>
    </a>
  </div>
</header>

<main class="form-page">
  <section class="form-hero">
    <div class="container narrow">
      <a class="back-link" href="job-lumiere.html">← 求人詳細へ戻る</a>
      <p class="eyebrow">JOB APPLICATION</p>
      <h1>求人応募</h1>
      <p>BAR LUMIÈREへの応募フォームです。</p>
    </div>
  </section>

  <section class="section">
    <div class="container narrow">
      <form action="https://formspree.io/f/mpparpba" method="POST" id="jobApplyForm" class="listing-form">
    <input type="hidden" name="_subject" value="【KUMAMOTO BAR NAVI】求人応募">
    <input type="hidden" name="送信種別" value="求人応募">

        <div class="form-section">
          <p class="eyebrow">YOUR INFO</p>
          <h2>応募者情報</h2>

          <label class="field">
            <span>お名前 <em>必須</em></span>
            <input type="text" id="name" name="氏名" required>
          </label>

          <div class="field-row">
            <label class="field">
              <span>年齢 <em>必須</em></span>
              <input type="number" id="age" name="年齢" min="18" required>
            </label>
            <label class="field">
              <span>電話番号 <em>必須</em></span>
              <input type="tel" id="phone" name="電話番号" required>
            </label>
          </div>

          <label class="field">
            <span>メールアドレス <em>必須</em></span>
            <input type="email" id="email" name="email" required>
          </label>

          <label class="field">
            <span>希望職種</span>
            <select id="position">
              <option>ホールスタッフ</option>
              <option>バーテンダー</option>
              <option>どちらでも可</option>
            </select>
          </label>

          <label class="field">
            <span>勤務可能日・時間</span>
            <textarea id="availability" rows="4" placeholder="例：週3日、20時以降"></textarea>
          </label>

          <label class="field">
            <span>自己PR・質問</span>
            <textarea id="message" name="応募メッセージ" rows="5"></textarea>
          </label>

          <label class="agree">
            <input type="checkbox" required>
            <span>入力内容に間違いがないことを確認しました。</span>
          </label>

          <button type="submit" class="btn-gold submit-btn">応募内容を送信する →</button>
        </div>
      </form>
    </div>
  </section>
</main>



<script>
/* KBN_JOB_FORMSPREE */
(function(){
  const form=document.querySelector("form");
  if(!form) return;
  form.action="https://formspree.io/f/mpparpba";
  form.method="POST";

  form.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!form.checkValidity()){ form.reportValidity(); return; }
    const btn=form.querySelector('button[type="submit"],input[type="submit"]');
    const old=btn ? (btn.textContent || btn.value) : "";
    if(btn){ btn.disabled=true; if(btn.tagName==="INPUT") btn.value="送信中..."; else btn.textContent="送信中..."; }

    try{
      const res=await fetch(form.action,{
        method:"POST",
        body:new FormData(form),
        headers:{"Accept":"application/json"}
      });
      if(res.ok){ location.href="action-complete.html?type=job"; return; }
      alert("送信できませんでした。もう一度お試しください。");
    }catch(err){
      alert("通信エラーが発生しました。");
    }finally{
      if(btn){ btn.disabled=false; if(btn.tagName==="INPUT") btn.value=old; else btn.textContent=old; }
    }
  });
})();
</script>

</body>
</html>
