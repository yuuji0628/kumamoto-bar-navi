<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KBN運営管理</title><link rel="stylesheet" href="style.css"></head>
<body class="admin-body"><main class="admin-page"><div class="container">
<section class="admin-welcome"><div><p class="eyebrow">KBN ADMIN v32</p><h1>運営管理</h1><p>店舗・画像・求人・掲載申込みをまとめて管理できます。</p></div><div class="admin-security-badge">🔒 Cloudflare Access</div></section>
<nav class="admin-tabs"><button data-tab="shops" class="active">店舗</button><button data-tab="jobs">求人</button><button data-tab="subs">申込み</button><button data-tab="ownerreq">店舗申請</button></nav>

<section id="tab-shops" class="admin-block">
<div class="admin-block-head"><div><p class="eyebrow">SHOPS</p><h2>店舗管理</h2></div><button id="reloadShops" class="admin-secondary-btn">再読み込み</button></div>
<form id="shopForm" class="admin-shop-form">
<input type="hidden" id="shopId">
<div class="admin-form-grid">
<label><span>店舗名 *</span><input id="name" required></label>
<label><span>読み方</span><input id="name_kana"></label>
<label><span>slug</span><input id="slug"></label>
<label><span>エリア *</span><input id="area" required placeholder="熊本市"></label>
<label class="span-2"><span>住所</span><input id="address"></label>
<label><span>営業時間</span><input id="hours"></label><label><span>定休日</span><input id="holiday"></label>
<label><span>ジャンル</span><input id="genre"></label><label><span>席数</span><input id="seats" type="number"></label>
<label><span>予算下限</span><input id="budget_min" type="number"></label><label><span>予算上限</span><input id="budget_max" type="number"></label>
<label class="span-2"><span>Instagram</span><input id="instagram"></label>
<label class="span-2"><span>特徴</span><input id="features"></label>
<label class="span-2"><span>紹介文</span><textarea id="description" rows="5"></textarea></label>
<label><span>並び順</span><input id="sort_order" type="number" value="100"></label>
<label><span>画像URL</span><input id="image_url"></label>
<label class="span-2"><span>店舗画像（R2）</span><input id="imageFile" type="file" accept="image/*"><button type="button" id="uploadImage" class="admin-secondary-btn">画像をアップロード</button><small id="uploadStatus"></small></label>
</div>
<div class="admin-check-row"><label><input id="is_published" type="checkbox" checked>公開</label><label><input id="is_featured" type="checkbox">おすすめ</label><label><input id="is_new" type="checkbox" checked>NEW</label><label><input id="is_recruiting" type="checkbox">求人あり</label></div>
<div class="admin-form-actions"><button class="btn-gold">保存</button><button type="button" id="resetShop" class="admin-secondary-btn">新規入力</button></div>
</form>
<div id="shopList" class="admin-shop-list"></div>
</section>

<section id="tab-jobs" class="admin-block" hidden>
<div class="admin-block-head"><div><p class="eyebrow">JOBS</p><h2>求人管理</h2></div></div>
<form id="jobForm" class="admin-shop-form">
<input type="hidden" id="jobId">
<div class="admin-form-grid">
<label><span>店舗</span><select id="jobShop"></select></label>
<label><span>求人タイトル *</span><input id="jobTitle" required></label>
<label><span>雇用形態</span><input id="jobType"></label><label><span>給与</span><input id="jobSalary"></label>
<label><span>勤務時間</span><input id="jobHours"></label><label><span>並び順</span><input id="jobOrder" type="number" value="100"></label>
<label class="span-2"><span>仕事内容</span><textarea id="jobDescription" rows="5"></textarea></label>
<label class="span-2"><span>応募先</span><input id="jobContact"></label>
</div><div class="admin-check-row"><label><input id="jobPublished" type="checkbox" checked>公開</label></div>
<div class="admin-form-actions"><button class="btn-gold">保存</button></div>
</form><div id="jobList" class="admin-shop-list"></div>
</section>

<section id="tab-subs" class="admin-block" hidden>
<div class="admin-block-head"><div><p class="eyebrow">SUBMISSIONS</p><h2>掲載申込み</h2></div><button id="reloadSubs" class="admin-secondary-btn">再読み込み</button></div>
<div id="subList" class="admin-shop-list"></div>
</section>

<section id="tab-ownerreq" class="admin-block" hidden>
<div class="admin-block-head"><div><p class="eyebrow">OWNER REQUESTS</p><h2>掲載店舗からの申請</h2></div><button id="reloadOwnerReq" class="admin-secondary-btn">再読み込み</button></div>
<p style="color:#aeb4bd">店舗専用ページから届いた変更・写真・求人・イベント・クーポン申請です。内容を確認し、必要な反映後に「対応済み」にしてください。</p>
<div id="ownerReqList" class="admin-shop-list"></div>
</section>

</div></main>
<script>
const $=id=>document.getElementById(id);let shops=[],jobs=[],subs=[];
document.querySelectorAll(".admin-tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".admin-tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");["shops","jobs","subs","ownerreq"].forEach(x=>$("tab-"+x).hidden=x!==b.dataset.tab)});
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(u,o={}){const r=await fetch(u,{credentials:"same-origin",...o});const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d}
async function loadShops(){const d=await api("/api/admin/shops");shops=d.shops||[];$("jobShop").innerHTML='<option value="">店舗なし</option>'+shops.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");$("shopList").innerHTML=shops.map(s=>`<article class="admin-shop-item"><div><h3>${esc(s.name)} ${s.is_featured?'⭐':''} ${s.is_new?'NEW':''}</h3><p>${esc(s.area)} / ${esc(s.genre||'')}</p><small>順:${s.sort_order} / ${s.is_published?'公開':'非公開'} / 専用URL:${s.owner_token_hash?'発行済み':'未発行'}</small></div><div class="admin-item-actions"><button onclick="editShop(${s.id})">編集</button><button onclick="issueOwnerLink(${s.id})">専用URL発行</button>${s.owner_token_hash?`<button onclick="revokeOwnerLink(${s.id})">URL無効化</button>`:''}<button onclick="deleteShop(${s.id})" style="border-color:#7a3030;color:#ffb3b3">完全削除</button></div></article>`).join("")}
window.editShop=id=>{const s=shops.find(x=>x.id==id);["name","name_kana","slug","area","address","hours","holiday","genre","instagram","features","description","image_url","sort_order","seats","budget_min","budget_max"].forEach(k=>$(k).value=s[k]??"");["is_published","is_featured","is_new","is_recruiting"].forEach(k=>$(k).checked=!!Number(s[k]));$("shopId").value=id;scrollTo(0,0)}

window.issueOwnerLink=async id=>{
  const s=shops.find(x=>x.id==id);if(!s)return;
  if(s.owner_token_hash&&!confirm(`「${s.name}」の専用URLを再発行しますか？\n古いURLは使えなくなります。`))return;
  try{
    const d=await api(`/api/admin/shops/${id}/owner-token`,{method:"POST"});
    await loadShops();
    prompt("このURLを店舗様へ送ってください。URLはこの画面で再表示できないため、必ずコピーしてください。",d.url);
  }catch(e){alert("URLを発行できませんでした: "+e.message)}
}
window.revokeOwnerLink=async id=>{
  const s=shops.find(x=>x.id==id);if(!s)return;
  if(!confirm(`「${s.name}」の専用URLを無効化しますか？`))return;
  try{
    await api(`/api/admin/shops/${id}/owner-token`,{method:"DELETE"});
    await loadShops();
    alert("専用URLを無効化しました");
  }catch(e){alert("無効化できませんでした: "+e.message)}
}
window.deleteShop=async id=>{
  const s=shops.find(x=>x.id==id);
  if(!s)return;
  const ok=confirm(`「${s.name}」を完全削除しますか？\n\nこの操作は元に戻せません。\n店舗データ・関連求人・R2店舗画像も削除されます。`);
  if(!ok)return;
  try{
    const d=await api(`/api/admin/shops/${id}`,{method:"DELETE"});
    if($("shopId").value==String(id)){$("shopForm").reset();$("shopId").value="";$("sort_order").value=100}
    await Promise.all([loadShops(),loadJobs()]);
    if(d.warning==="R2_IMAGE_DELETE_FAILED"){
      alert("店舗データは削除しましたが、R2画像だけ削除できませんでした。");
    }else{
      alert("完全削除しました");
    }
  }catch(e){
    alert("削除できませんでした: "+e.message);
  }
}
$("shopForm").onsubmit=async e=>{e.preventDefault();const id=$("shopId").value;const data={};["name","name_kana","slug","area","address","hours","holiday","genre","instagram","features","description","image_url"].forEach(k=>data[k]=$(k).value);["sort_order","seats","budget_min","budget_max"].forEach(k=>data[k]=$(k).value);["is_published","is_featured","is_new","is_recruiting"].forEach(k=>data[k]=$(k).checked);await api(id?`/api/admin/shops/${id}`:"/api/admin/shops",{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});await loadShops();alert("保存しました")}
$("resetShop").onclick=()=>{$("shopForm").reset();$("shopId").value="";$("sort_order").value=100}
$("uploadImage").onclick=async()=>{const f=$("imageFile").files[0];if(!f)return alert("画像を選択してください");const fd=new FormData();fd.append("file",f);$("uploadStatus").textContent="アップロード中...";try{const d=await api("/api/admin/upload",{method:"POST",body:fd});$("image_url").value=d.url;$("uploadStatus").textContent="完了"}catch(e){$("uploadStatus").textContent=e.message}}
async function loadJobs(){const d=await api("/api/admin/jobs");jobs=d.jobs||[];$("jobList").innerHTML=jobs.map(j=>`<article class="admin-shop-item"><div><h3>${esc(j.title)}</h3><p>${esc(j.shop_name||'店舗未指定')} / ${esc(j.salary||'')}</p></div></article>`).join("")}
$("jobForm").onsubmit=async e=>{e.preventDefault();const data={shop_id:$("jobShop").value,title:$("jobTitle").value,employment_type:$("jobType").value,salary:$("jobSalary").value,hours:$("jobHours").value,description:$("jobDescription").value,contact:$("jobContact").value,is_published:$("jobPublished").checked,sort_order:$("jobOrder").value};await api("/api/admin/jobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});await loadJobs();alert("求人を保存しました")}
async function loadSubs(){const d=await api("/api/admin/submissions");subs=d.submissions||[];$("subList").innerHTML=subs.map(s=>`<article class="admin-shop-item"><div><h3>${esc(s.shop_name)}</h3><p>${esc(s.contact_name||'')} / ${esc(s.status)}</p><small>${esc(s.address||'')}</small></div><div class="admin-item-actions">${s.status==='pending'?`<button onclick="approve(${s.id})">承認して店舗化</button><button onclick="rejectSub(${s.id})">却下</button>`:''}</div></article>`).join("")}
window.approve=async id=>{await api(`/api/admin/submissions/${id}/approve`,{method:"POST"});await Promise.all([loadSubs(),loadShops()])}
window.rejectSub=async id=>{await api(`/api/admin/submissions/${id}/reject`,{method:"POST"});await loadSubs()}

const reqLabel={profile:"店舗情報変更",photo:"写真変更",job:"求人",event:"イベント",coupon:"クーポン"};
async function loadOwnerReq(){
  const d=await api("/api/admin/owner-requests");
  const list=d.requests||[];
  $("ownerReqList").innerHTML=list.length?list.map(r=>{
    let p={};try{p=JSON.parse(r.payload||"{}")}catch{}
    const details=Object.entries(p).map(([k,v])=>`<div><b>${esc(k)}</b>：${esc(v)}</div>`).join("");
    return `<article class="admin-shop-item"><div class="admin-shop-main"><h3>${esc(r.shop_name)} / ${esc(reqLabel[r.request_type]||r.request_type)}</h3><p>${esc(r.status)} / ${esc(r.created_at||"")}</p><div style="margin-top:8px;color:#cbd0d7;font-size:12px;line-height:1.7">${details||"内容なし"}</div></div><div class="admin-item-actions">${r.status==="pending"?`<button onclick="finishOwnerReq(${r.id},'reviewed')">対応済み</button><button onclick="finishOwnerReq(${r.id},'rejected')">却下</button>`:""}</div></article>`
  }).join(""):'<p>申請はありません。</p>';
}
window.finishOwnerReq=async(id,status)=>{
  await api(`/api/admin/owner-requests/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});
  await loadOwnerReq();
}

$("reloadShops").onclick=loadShops;$("reloadSubs").onclick=loadSubs;$("reloadOwnerReq").onclick=loadOwnerReq;
Promise.all([loadShops(),loadJobs(),loadSubs(),loadOwnerReq()]);
</script></body></html>
