<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#080b10">
<title>無料会員登録｜KUMAMOTO BAR NAVI</title>
<link rel="stylesheet" href="style.css?v=196">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:#080b10;color:#fff}
.member-page{padding:24px 0 110px}
.member-wrap{max-width:680px;margin:auto}
.member-head{margin:10px 0 18px}
.member-head a{color:#efc45a;text-decoration:none;font-weight:800;font-size:.78rem}
.member-head h1{margin:12px 0 6px;font-size:clamp(1.7rem,7vw,2.35rem);line-height:1.15}
.member-head p{margin:0;color:#929ca7;font-size:.82rem;line-height:1.65}

.member-card{
  padding:16px;
  border:1px solid #303a45;
  border-radius:18px;
  background:#0d141c;
  margin-bottom:12px
}
.member-card h2{margin:0 0 12px;font-size:1.05rem}
.member-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px}
.member-tabs button{
  min-height:44px;
  border:1px solid #36414c;
  border-radius:11px;
  background:#101821;
  color:#b9c2cb;
  font-weight:900;
  font-size:.82rem
}
.member-tabs button.active{background:#efc45a;color:#111;border-color:#efc45a}

.member-form{display:grid;gap:10px}
.member-form label{display:grid;gap:5px;color:#aeb6bf;font-size:.72rem;font-weight:800}
.member-form input{
  min-height:48px;
  border:1px solid #384450;
  border-radius:11px;
  background:#080e14;
  color:#fff;
  padding:0 12px;
  font:inherit;
  font-size:16px
}
.member-form input:focus{outline:2px solid rgba(239,196,90,.42);border-color:#efc45a}
.member-check{
  display:flex!important;
  align-items:flex-start;
  gap:8px!important;
  font-weight:500!important;
  line-height:1.5
}
.member-check input{min-height:0;width:18px;height:18px;margin-top:1px;accent-color:#efc45a}

.member-submit{
  width:100%;
  min-height:52px;
  border:1px solid #efc45a;
  border-radius:12px;
  background:#efc45a!important;
  color:#111!important;
  font-weight:950;
  font-size:.95rem;
  opacity:1!important;
  -webkit-appearance:none;
  appearance:none;
  cursor:pointer
}
.member-submit:not(:disabled):active{transform:translateY(1px)}
.member-submit:disabled{
  background:#b6943f!important;
  border-color:#b6943f!important;
  color:#151515!important;
  opacity:.82!important;
  cursor:wait
}
.member-status{min-height:22px;margin:9px 0 0;color:#9aa4ae;font-size:.72rem;line-height:1.5}
.member-status.error{color:#ff8c8c}
.member-status.ok{color:#74dca4}
.member-note{margin:11px 0 0;color:#75808b;font-size:.64rem;line-height:1.6}

/* My page */
.member-profile-hero{
  padding:18px;
  border:1px solid #5a4b24;
  border-radius:18px;
  background:
    radial-gradient(circle at top right,rgba(239,196,90,.12),transparent 42%),
    linear-gradient(180deg,#121820,#0c131a);
  margin-bottom:12px
}
.member-profile-kicker{
  margin:0 0 4px;
  color:#efc45a;
  font-weight:900;
  font-size:.62rem;
  letter-spacing:.15em
}
.member-profile-hero h2{margin:0;font-size:1.35rem}
.member-profile-hero p{margin:5px 0 0;color:#929ca7;font-size:.72rem}

.member-dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.member-stat{
  padding:12px;
  border:1px solid #2e3944;
  border-radius:13px;
  background:#0a1118
}
.member-stat span{display:block;color:#818b96;font-size:.6rem}
.member-stat strong{display:block;margin-top:2px;color:#fff;font-size:1.1rem}
.member-stat strong.gold{color:#efc45a}

.member-profile{display:grid;gap:10px}
.member-profile-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #252f38
}
.member-profile-row span{color:#8f99a4;font-size:.7rem}
.member-profile-row b{font-size:.78rem;text-align:right;overflow-wrap:anywhere}
.member-action{
  min-height:44px;
  border:1px solid #394550;
  border-radius:10px;
  background:#101821;
  color:#fff;
  font-weight:850
}
.member-action.gold{border-color:#665421;color:#efc45a}
.member-action.danger{border-color:#5e3434;color:#ff9a9a;background:#130d0d}

.member-section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px
}
.member-section-head h2{margin:0}
.member-section-head a{font-size:.65rem;color:#efc45a;text-decoration:none;font-weight:850}

.member-favs{display:grid;gap:8px}
.member-fav{
  display:grid;
  grid-template-columns:58px 1fr auto;
  gap:10px;
  align-items:center;
  padding:9px;
  border:1px solid #2d3742;
  border-radius:13px;
  background:#0a1017;
  text-decoration:none;
  color:#fff
}
.member-fav img{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#111}
.member-fav b{display:block;font-size:.78rem}
.member-fav small{display:block;margin-top:3px;color:#89939e;font-size:.62rem}
.member-fav i{color:#efc45a;font-style:normal;font-size:1.2rem}
.member-empty{color:#87919c;font-size:.74rem;line-height:1.65}
[hidden]{display:none!important}

@media(max-width:640px){
  .member-page{padding-top:14px}
  .member-card{padding:14px}
  .member-dashboard-grid{grid-template-columns:1fr 1fr}
}

.member-free-badge{
  display:inline-flex;
  align-items:center;
  min-height:27px;
  margin:10px 0 0;
  padding:0 11px;
  border:1px solid #6b5720;
  border-radius:999px;
  background:rgba(239,196,90,.1);
  color:#efc45a;
  font-size:.67rem;
  font-weight:950;
  letter-spacing:.04em;
}
.member-submit{
  box-shadow:0 10px 26px rgba(239,196,90,.17);
}

</style>
</head>
<body>
<header class="public-header">
  <div class="container public-header-inner">
    <a class="public-brand" href="index.html">
      <img src="logo.png" alt="KUMAMOTO BAR NAVI">
      <span><b>KUMAMOTO</b><strong>BAR NAVI</strong><small>FREE MEMBER</small></span>
    </a>
    <a class="public-header-cta" href="bars.html">BARを探す</a>
  </div>
</header>

<main class="member-page">
<div class="container member-wrap">
  <div class="member-head">
    <a href="index.html">← ホームへ</a>
    <p class="member-free-badge">登録無料</p><h1>無料会員登録</h1>
    <p>登録料・月額料金は0円。お気に入りをアカウントに保存でき、希望する方には新しく掲載されたBAR情報もメールでお届けします。</p>
  </div>

  <section id="authCard" class="member-card">
    <div class="member-tabs">
      <button id="tabRegister" class="active" type="button">無料会員登録</button>
      <button id="tabLogin" type="button">ログイン</button>
    </div>

    <form id="registerForm" class="member-form">
      <label>ニックネーム
        <input name="display_name" maxlength="80" autocomplete="nickname" placeholder="ニックネームを入力">
      </label>
      <label>メールアドレス
        <input name="email" type="email" required autocomplete="email" placeholder="mail@example.com">
      </label>
      <label>パスワード
        <input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="8文字以上">
      </label>
      <label class="member-check">
        <input name="email_notifications" type="checkbox" checked>
        <span>新しく掲載されたBAR情報をメールで受け取る（いつでも停止できます）</span>
      </label>
      <button class="member-submit" type="submit">無料会員登録</button>
    </form>

    <form id="loginForm" class="member-form" hidden>
      <label>メールアドレス
        <input name="email" type="email" required autocomplete="email">
      </label>
      <label>パスワード
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <button class="member-submit" type="submit">ログイン</button>
    </form>
    <p id="authStatus" class="member-status"></p>
    <p class="member-note">パスワードはハッシュ化して保存されます。閲覧は会員登録なしでもこれまで通り利用できます。</p>
  </section>

  <section id="profileCard" hidden>
    <div class="member-profile-hero">
      <p class="member-profile-kicker">MY BAR NAVI</p>
      <h2><span id="memberNameHero">会員</span>さんのマイページ</h2>
      <p>お気に入りや新着メール設定をここで管理できます。</p>

      <div class="member-dashboard-grid">
        <div class="member-stat">
          <span>お気に入り</span>
          <strong id="favoriteCount" class="gold">0</strong>
        </div>
        <div class="member-stat">
          <span>新着メール</span>
          <strong id="notifyState">OFF</strong>
        </div>
      </div>
    </div>

    <div class="member-card">
      <div class="member-section-head">
        <h2>アカウント</h2>
      </div>
      <div class="member-profile">
        <div class="member-profile-row"><span>ニックネーム</span><b id="memberName">-</b></div>
        <div class="member-profile-row"><span>メール</span><b id="memberEmail">-</b></div>
        <label class="member-check">
          <input id="memberNotify" type="checkbox">
          <span>新しく掲載されたBAR情報をメールで受け取る</span>
        </label>
        <button id="logoutBtn" class="member-action danger" type="button">ログアウト</button>
      </div>
    </div>
  </section>

  <section id="favoritesCard" class="member-card" hidden>
    <div class="member-section-head">
      <h2>お気に入りBAR</h2>
      <a href="bars.html">BARを探す →</a>
    </div>
    <div id="favoriteList" class="member-favs"></div>
  </section>
</div>
</main>

<script>
const qs=s=>document.querySelector(s);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const authCard=qs("#authCard"),profileCard=qs("#profileCard"),favoritesCard=qs("#favoritesCard");
const status=qs("#authStatus");
const resetSubmitButtons=()=>{
  document.querySelectorAll(".member-submit").forEach(btn=>{
    btn.disabled=false;
    btn.textContent=btn.closest("#loginForm")?"ログイン":"無料会員登録";
  });
};
window.addEventListener("pageshow",resetSubmitButtons);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)resetSubmitButtons()});

function showStatus(text,type=""){
  status.textContent=text||"";
  status.className="member-status"+(type?` ${type}`:"");
}
function errorMessage(code,detail=""){
  const known=({
    INVALID_EMAIL:"メールアドレスを確認してください。",
    PASSWORD_MIN_8:"パスワードは8文字以上にしてください。",
    EMAIL_ALREADY_REGISTERED:"このメールアドレスは登録済みです。ログインをお試しください。",
    LOGIN_FAILED:"メールアドレスまたはパスワードが違います。"
  })[code];
  if(known)return known;
  if(code==="REGISTER_FAILED"&&detail)return `登録処理エラー：${detail}`;
  return `処理に失敗しました${code?`（${code}）`:""}。`;
}
function setTab(mode){
  const reg=mode==="register";
  qs("#tabRegister").classList.toggle("active",reg);
  qs("#tabLogin").classList.toggle("active",!reg);
  qs("#registerForm").hidden=!reg;
  qs("#loginForm").hidden=reg;
  showStatus("");
}
qs("#tabRegister").onclick=()=>setTab("register");
qs("#tabLogin").onclick=()=>setTab("login");

async function refreshMe(){
  try{
    const r=await fetch("/api/member/me",{cache:"no-store"});
    const d=await r.json();
    const m=d.member;
    if(!m){
      authCard.hidden=false;
      profileCard.hidden=true;
      favoritesCard.hidden=true;
      return;
    }
    authCard.hidden=true;
    profileCard.hidden=false;
    favoritesCard.hidden=false;
    const displayName=m.display_name||"会員";
    qs("#memberName").textContent=displayName;
    qs("#memberNameHero").textContent=displayName;
    qs("#memberEmail").textContent=m.email||"";
    qs("#memberNotify").checked=!!m.email_notifications;
    qs("#notifyState").textContent=m.email_notifications?"ON":"OFF";
    qs("#notifyState").classList.toggle("gold",!!m.email_notifications);
    await loadFavorites();
  }catch{}
}
async function loadFavorites(){
  const box=qs("#favoriteList");
  const r=await fetch("/api/member/favorites",{cache:"no-store"});
  const d=await r.json();
  const rows=Array.isArray(d.favorites)?d.favorites:[];
  const countEl=qs("#favoriteCount");
  if(countEl)countEl.textContent=String(rows.length);
  if(!rows.length){
    box.innerHTML='<p class="member-empty">まだお気に入りはありません。店舗詳細の「♡ お気に入り」から追加できます。</p>';
    return;
  }
  box.innerHTML=rows.map(s=>`
    <a class="member-fav" href="shop.html?slug=${encodeURIComponent(s.slug||"")}">
      <img src="${esc(s.image_url||"default-bar.svg")}" onerror="this.src='default-bar.svg'" alt="">
      <span><b>${esc(String(s.name||"").replace(/^【KBN独自掲載】/,""))}</b><small>${esc([s.area,s.genre].filter(Boolean).join(" / "))}</small></span>
      <i>›</i>
    </a>
  `).join("");
}
qs("#registerForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const form=e.currentTarget;
  const btn=form.querySelector('button[type="submit"]');
  if(btn.disabled)return;

  btn.disabled=true;
  btn.textContent="登録中…";
  showStatus("登録しています...");

  const f=new FormData(form);
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);

  try{
    const r=await fetch("/api/member/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal:controller.signal,
      body:JSON.stringify({
        display_name:f.get("display_name"),
        email:f.get("email"),
        password:f.get("password"),
        email_notifications:f.get("email_notifications")==="on"
      })
    });

    let d={};
    try{d=await r.json()}catch{}

    if(!r.ok){
      showStatus(errorMessage(d.error||`HTTP_${r.status}`,d.detail||""),"error");
      return;
    }

    showStatus("登録しました。マイページを表示します。","ok");
    await resetSubmitButtons();
refreshMe();
  }catch(err){
    if(err?.name==="AbortError"){
      showStatus("登録処理がタイムアウトしました。もう一度お試しください。","error");
    }else{
      showStatus("通信エラーが発生しました。もう一度お試しください。","error");
    }
  }finally{
    clearTimeout(timer);
    btn.disabled=false;
    btn.textContent="無料会員登録";
  }
});
qs("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const form=e.currentTarget;
  const btn=form.querySelector('button[type="submit"]');
  if(btn.disabled)return;

  btn.disabled=true;
  btn.textContent="ログイン中…";
  showStatus("ログインしています...");

  const f=new FormData(form);
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);

  try{
    const r=await fetch("/api/member/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal:controller.signal,
      body:JSON.stringify({email:f.get("email"),password:f.get("password")})
    });
    let d={};try{d=await r.json()}catch{}
    if(!r.ok){showStatus(errorMessage(d.error||`HTTP_${r.status}`),"error");return}
    showStatus("ログインしました。","ok");
    await refreshMe();
  }catch(err){
    showStatus(err?.name==="AbortError"
      ?"ログイン処理がタイムアウトしました。"
      :"通信エラーが発生しました。","error");
  }finally{
    clearTimeout(timer);
    btn.disabled=false;
    btn.textContent="ログイン";
  }
});
qs("#logoutBtn").onclick=async()=>{
  await fetch("/api/member/logout",{method:"POST"});
  await refreshMe();
};
qs("#memberNotify").onchange=async e=>{
  const next=e.target.checked;
  const r=await fetch("/api/member/preferences",{
    method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email_notifications:next})
  });
  if(!r.ok){
    e.target.checked=!next;
    return;
  }
  const state=qs("#notifyState");
  if(state){
    state.textContent=next?"ON":"OFF";
    state.classList.toggle("gold",next);
  }
};
refreshMe();
</script>
</body>
</html>
